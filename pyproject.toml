[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "explainkit"
version = "0.2.0"
description = "Explain the classifier, then test the explanation: word-level attributions, token selection, prompt steering, replacement probes and faithfulness metrics for any text classifier."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hadi Mohammadi" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.5",
    "matplotlib>=3.8",
]
keywords = ["explainable-ai", "interpretability", "shap", "feature-attribution", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/mohammadi-hadi/explainkit"
Issues = "https://github.com/mohammadi-hadi/explainkit/issues"

[project.scripts]
explainkit = "explainkit.cli:main"

[project.optional-dependencies]
# shap 0.53 is the first that honours the seed for text, and it needs Python
# 3.12; on 3.11 the newest shap is 0.51, and explainkit warns about the seed.
shap = ["shap>=0.53; python_version >= '3.12'", "shap>=0.45; python_version < '3.12'"]
lime = ["lime>=0.2.0.1"]
transformers = ["transformers>=4.40", "torch>=2.2"]
all = [
    "shap>=0.53; python_version >= '3.12'",
    "shap>=0.45; python_version < '3.12'",
    "lime>=0.2.0.1",
    "transformers>=4.40",
    "torch>=2.2",
]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "mypy>=1.10",
    "scikit-learn>=1.4",
    "scipy>=1.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
explainkit = ["py.typed"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "shap.*",
    "lime.*",
    "lime.lime_text",
    "transformers.*",
    "sklearn.*",
    "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
