name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src

  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest

  # The base test job runs without shap, so its backend tests skip there.
  # This job installs it and runs them, the seed check among them.
  shap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,shap]"
      - run: pytest tests/test_backends_optional.py

  # The committed demo report and the README table must be exactly what the
  # code regenerates.  Dependencies are pinned so a numeric change can only
  # come from this repository's own code.
  results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-results.txt
      - run: pip install -e . --no-deps
      - run: explainkit demo --out results
      - run: explainkit inject-readme README.md --results results
      - run: git diff --exit-code -- results/report.md results/summary.md README.md
